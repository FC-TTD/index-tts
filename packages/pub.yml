---
- name: Publish to PyPI
  hosts: localhost
  roles: 
  - role: /workspace/z/ansible/roles/pypi_pub
    vars:
      pypi_pub_url: "https://pypi-server"
      pypi_pub_curl_verbose: false
      pypi_pub_curl_ignore_conflict: true
      pypi_pub_package_path: ttd_fastapi_utils # 这样是正确的，role会自动处理相对路径