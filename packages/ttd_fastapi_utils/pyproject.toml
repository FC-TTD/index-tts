[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "ttd-fastapi-utils"
version = "0.1.1"
description = "TTD FastAPI Utils: CUDA health monitor and audio postprocess utilities (loudness/EQ)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "huanghuan", email = "huanghuan@fc-ttd.net" }
]
keywords = ["fastapi", "starlette", "healthcheck", "cuda", "middleware", "audio", "loudness", "postprocess"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: System :: Monitoring",
  "Topic :: Multimedia :: Sound/Audio",
  "Operating System :: OS Independent",
  "Environment :: GPU"
]
dependencies = [
  "fastapi>=0.100",
  "numpy>=1.22",
  "scipy>=1.10",
  "pyloudnorm>=0.1.1",
  "requests>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ttd_fastapi_utils"]
