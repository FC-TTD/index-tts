[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "ttd-fastapi-utils"
version = "0.3.0"
description = "TTD FastAPI Utils: cuda_health (/health + optional home probe /), home_probe payload, ttd_notify notifier, postprocess utilities (loudness/EQ/limiter), and SmartModel"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "huanghuan", email = "huanghuan@fc-ttd.net" }
]
keywords = ["fastapi", "starlette", "healthcheck", "cuda", "middleware", "audio", "loudness", "postprocess"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: System :: Monitoring",
  "Topic :: Multimedia :: Sound/Audio",
  "Operating System :: OS Independent",
  "Environment :: GPU"
]
dependencies = [
  "fastapi>=0.95",
  "numpy>=1.19",
  "scipy>=1.5",
  "pyloudnorm>=0.1.0",
  "requests>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ttd_fastapi_utils"]
