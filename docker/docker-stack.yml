# Single IndexTTS API + WebUI instance. Deploy through ./deploy.sh consolidate.
version: '3.8'
services:
  api-3:
    image: registry.ttd/index-tts/api:h-54be7b525694@sha256:7f3309bdacda8424cefb094cf09bee6f2b4499db1174bfa33da1b98378a3176a
    environment:
    - TZ=Asia/Shanghai
    - NVIDIA_VISIBLE_DEVICES=1
    - HF_HOME=/opt/hf_cache
    - HF_HUB_CACHE=/opt/hf_cache/hub
    - TRANSFORMERS_CACHE=/opt/hf_cache/transformers
    - MODELSCOPE_CACHE=/opt/hf_cache/modelscope
    - HF_HUB_DISABLE_XET=1
    - INDEXTTS_HF_LOCAL_ONLY=true
    - TORCH_EXTENSIONS_DIR=/opt/torch_extensions/ttd-worker-api-3
    - TORCHINDUCTOR_CACHE_DIR=/opt/torchinductor/ttd-worker-api-3
    - ENABLE_GRADIO_UI=true
    - GRADIO_MOUNT_PATH=/__gradio__
    - GRADIO_ALLOWED_HOSTS=xique,xique-tts.api.ttd.honeywave.net
    - APP_IMAGE=registry.ttd/index-tts/api
    - APP_IMAGE_TAG=h-54be7b525694
    - APP_CONTENT_HASH=h-54be7b525694
    - APP_GIT_COMMIT=738560d
    - BUILD_COMMIT=738560d
    - BUILD_TIME=
    volumes:
    - /TTD-Data/index-tts/checkpoints-v25:/app/checkpoints
    - /TTD-Data/index-tts/hf-cache:/opt/hf_cache
    - /TTD-Data/index-tts/hf-cache:/app/checkpoints/hf_cache
    - /TTD-Data/index-tts/torch-extensions:/opt/torch_extensions
    - /TTD-Data/index-tts/torchinductor:/opt/torchinductor
    networks:
    - caddy
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
        - node.hostname == ttd-worker
      update_config:
        parallelism: 0
        delay: 0s
        failure_action: pause
        order: stop-first
      restart_policy:
        condition: any
        max_attempts: 10
        delay: 10s
      labels:
        caddy_1: http://xique
        caddy_1.reverse_proxy: index-tts_api-3.:8000
        caddy_1.reverse_proxy.health_uri: /health
        caddy_1.reverse_proxy.health_interval: 10s
        caddy_1.reverse_proxy.health_timeout: 2s
        caddy_1.reverse_proxy.health_fails: 1
        caddy_1.reverse_proxy.health_passes: 1
        caddy_1.reverse_proxy.health_status: 200
        caddy_2: http://xique-tts-public-proxy
        caddy_2.reverse_proxy: index-tts_api-3.:8000
        caddy_2.reverse_proxy.header_up: Host xique-tts.api.ttd.honeywave.net
        caddy_2.reverse_proxy.header_up_1: X-Forwarded-Host xique-tts.api.ttd.honeywave.net
        caddy_2.reverse_proxy.header_up_2: X-Forwarded-Proto https
        caddy_2.reverse_proxy.header_up_3: X-Forwarded-Port 443
        caddy_2.reverse_proxy.health_uri: /health
        caddy_2.reverse_proxy.health_interval: 10s
        caddy_2.reverse_proxy.health_timeout: 2s
        caddy_2.reverse_proxy.health_fails: 1
        caddy_2.reverse_proxy.health_passes: 1
        caddy_2.reverse_proxy.health_status: 200
        caddy_0: http://index-api
        caddy_0.reverse_proxy: index-tts_api-3.:8000
        caddy_0.reverse_proxy.health_uri: /health
        caddy_0.reverse_proxy.health_interval: 10s
        caddy_0.reverse_proxy.health_timeout: 2s
        caddy_0.reverse_proxy.health_fails: '1'
        caddy_0.reverse_proxy.health_passes: '1'
        caddy_0.reverse_proxy.health_status: '200'
    labels:
      io.portainer.accesscontrol.public: null
networks:
  caddy:
    external: true
    name: caddy
