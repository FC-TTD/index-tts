version: "3.8"

services:
  api:
    image: ${REGISTRY_URL:-registry:5000}/index-tts/api:${IMAGE_TAG:-latest}
    environment:
      - TZ=Asia/Shanghai
      - TASK_SLOT={{.Task.Slot}}
    volumes:
      - /TTD-Data/index-tts/checkpoints-v2:/app/checkpoints
    networks:
      - caddy
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.hostname == ttd-edge
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  caddy:
    external: true
    name: caddy